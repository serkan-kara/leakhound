name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    build:
        name: Build binaries (${{ matrix.goos }}-${{ matrix.goarch }})
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                include:
                    - goos: linux
                      goarch: amd64
                      ext: ""
                    - goos: linux
                      goarch: arm64
                      ext: ""
                    - goos: darwin
                      goarch: amd64
                      ext: ""
                    - goos: darwin
                      goarch: arm64
                      ext: ""
                    - goos: windows
                      goarch: amd64
                      ext: ".exe"

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.22"

            - name: Build
              env:
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
              run: |
                  set -euo pipefail

                  VERSION="${GITHUB_REF_NAME}"
                  COMMIT="$(git rev-parse --short HEAD)"
                  BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

                  OUT="leakhound-${GOOS}-${GOARCH}${{ matrix.ext }}"

                  echo "Building ${OUT}"
                  echo "  Version   : ${VERSION}"
                  echo "  Commit    : ${COMMIT}"
                  echo "  Build date: ${BUILD_DATE}"
                  echo "  Platform  : ${GOOS}-${GOARCH}"

                  go build -o "${OUT}" -ldflags "\
                  -X main.Version=${VERSION} \
                  -X main.Commit=${COMMIT} \
                  -X main.BuildDate=${BUILD_DATE}" .

                  ls -lah "${OUT}"

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: leakhound-${{ matrix.goos }}-${{ matrix.goarch }}
                  path: leakhound-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
                  if-no-files-found: error

    release:
        name: Create GitHub Release
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: dist

            - name: List files
              run: |
                  set -euo pipefail
                  find dist -type f -maxdepth 2 -print
                  ls -lah dist || true

            - name: Create release and upload assets
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      dist/**/leakhound-*
                  generate_release_notes: true
                  draft: false
