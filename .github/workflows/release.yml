name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    build-and-release:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                include:
                    - goos: linux
                      goarch: amd64
                      ext: ""
                    - goos: linux
                      goarch: arm64
                      ext: ""
                    - goos: darwin
                      goarch: amd64
                      ext: ""
                    - goos: darwin
                      goarch: arm64
                      ext: ""
                    - goos: windows
                      goarch: amd64
                      ext: ".exe"

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.22"

            - name: Build binary
              env:
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
              run: |
                  set -euo pipefail

                  VERSION="${GITHUB_REF_NAME}"
                  COMMIT="$(git rev-parse --short HEAD)"
                  BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

                  OUT="leakhound-${GOOS}-${GOARCH}${{ matrix.ext }}"

                  echo "Building ${OUT}"
                  echo "  Version   : ${VERSION}"
                  echo "  Commit    : ${COMMIT}"
                  echo "  Build date: ${BUILD_DATE}"
                  echo "  Platform  : ${GOOS}-${GOARCH}"

                  go build -o "${OUT}" -ldflags "\
                  -X main.Version=${VERSION} \
                  -X main.Commit=${COMMIT} \
                  -X main.BuildDate=${BUILD_DATE}" .

                  ls -lah "${OUT}"

            - name: Create GitHub Release and upload assets
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      leakhound-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
